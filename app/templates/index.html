<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Facial Recognition Agent</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Facial Recognition Agent</h1>

    <div class="controls">
        <input
            type="file"
            id="imageInput"
            accept="image/*">

        <button id="analyseButton">
            Analyse Image
        </button>
    </div>

    <div class="main-content">

        <div class="panel">
            <h2>Uploaded Image</h2>

            <img id="preview">
        </div>

        <div class="panel">
            <div id="results">
                <h2>Results</h2>
                <p>Upload an image and click analyse to view predictions.</p>
            </div>
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
